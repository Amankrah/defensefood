[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defensefood"
version = "0.1.0"
description = "EU Food Fraud Vulnerability Intelligence System"
requires-python = ">=3.10"
dependencies = [
    "defensefood-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # AI subsystem (Phase 1): provider SDKs + retry + env-loaded config.
    "anthropic>=0.40",
    "openai>=1.60",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic-settings>=2.5",
    # Predictive epic (Phase 2): gradient-boosted tree forecaster with quantile
    # loss for confidence intervals. Pooled across all corridors; not a deep
    # learning model — the data is too small.
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# `backend/` contains `data/`, `script/`, `blueprint/`, and `defensefood/` at
# the top level. setuptools' default flat-layout discovery sees all four and
# refuses to guess. Tell it explicitly: only `defensefood` (and its
# sub-packages) is the Python distribution. Everything else is operational
# data / scripts / docs that get shipped alongside but not as importable
# Python modules.
[tool.setuptools.packages.find]
where = ["."]
include = ["defensefood*"]
exclude = ["data*", "script*", "blueprint*", "tests*"]
